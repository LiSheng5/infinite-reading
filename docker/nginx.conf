# 无限阅读 · 自托管用的 nginx 配置（见根目录 Dockerfile）
#
# 托管的是构建产物 dist/site（阶段 1 起）：assets/ 下是内容 hash 文件名，其余是稳定名。
# 三个要点：
#   1) .webmanifest 的 MIME 要显式声明，否则浏览器不认 PWA manifest。
#      只能用 location + default_type 按路径补——server 级写 types{} 会**整体覆盖**
#      http 级 mime.types，html/css/js 全部掉到 default_type（octet-stream），整站不渲染；
#   2) sw.js / index.html / manifest.webmanifest 是稳定名，**不能**长缓存，
#      否则发新版本后用户永远拿到旧页面 / 旧清单；
#   3) assets/ 下的文件名带内容 hash（Vite 产物），长缓存 + immutable 安全——
#      内容一变文件名就变，天然的失效开关；icons/ 稳定名但很少动，给 7 天。

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;

    # PWA manifest 的 MIME：按路径补 default_type（webmanifest 不在 mime.types 里）
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Service Worker：绝不长缓存（它本身就是「新版本来了」的信号）
    location = /sw.js {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # 入口页：总是回源校验
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # 构建产物（hash 文件名）：放心长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # 图标（稳定名，很少动）
    location /icons/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
