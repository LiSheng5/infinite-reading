# 无限阅读 · 自托管用的 nginx 配置（见根目录 Dockerfile）
#
# 三个要点：
#   1) .webmanifest 的 MIME 要显式声明，否则浏览器不认 PWA manifest。
#      只能用 location + default_type 按路径补——server 级写 types{} 会**整体覆盖**
#      http 级 mime.types，html/css/js 全部掉到 default_type（octet-stream），整站不渲染；
#   2) sw.js 与 index.html **不能**长缓存，否则发新版本后用户永远拿到旧页面；
#   3) 带 ?v= 的 CSS / JS 可以放心长缓存（版本串本身就是失效开关）。

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;

    # PWA manifest 的 MIME：按路径补 default_type（webmanifest 不在 mime.types 里）
    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    # Service Worker：绝不长缓存
    location = /sw.js {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # 入口页：总是回源校验
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # 静态资源：带版本串，长缓存
    location ~* \.(css|js|svg|png|jpg|jpeg|gif|webp|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
