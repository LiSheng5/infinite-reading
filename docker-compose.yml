# 无限阅读 · 自托管（NAS / 小主机友好）
#
#   docker compose up -d        → http://localhost:8080/
#
# 数据全在**访问者自己的浏览器**里，容器本身无状态、无需挂载卷、也不保存任何东西。

services:
  infinite-reading:
    build: .
    # 有了镜像仓库后可以改成拉取，避免每次本地构建：image: ghcr.io/lisheng5/infinite-reading:latest
    ports:
      - "8080:80"
    restart: unless-stopped
