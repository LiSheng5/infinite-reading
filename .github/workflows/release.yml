name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: tag 与 VERSION 必须一致
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(cat VERSION)"
          echo "tag=$tag VERSION=$ver"
          [ "$tag" = "$ver" ] || { echo "::error::tag（$tag）与 VERSION（$ver）不一致，请先跑 node tools/sync-version.mjs"; exit 1; }

      - name: 版本号一致性
        run: node tools/sync-version.mjs --check

      - name: 发布前跑离线评测
        run: node eval/run.js

      - name: 打包源码 zip
        run: |
          mkdir -p dist
          git archive --format=zip --prefix="infinite-reading-${GITHUB_REF_NAME}/" \
            -o "dist/infinite-reading-${GITHUB_REF_NAME}.zip" HEAD

      # 产物一并挂进 Release：单文件（双击即玩）+ 多文件站点（自托管可直接丢给 nginx）
      - name: 构建发布产物
        run: |
          npm ci
          npm run build
          cp dist/single/index.html "dist/infinite-reading-${GITHUB_REF_NAME}-single.html"
          (cd dist/site && zip -qr "../../dist/infinite-reading-${GITHUB_REF_NAME}-site.zip" .)

      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/infinite-reading-${GITHUB_REF_NAME}.zip" \
            "dist/infinite-reading-${GITHUB_REF_NAME}-single.html" \
            "dist/infinite-reading-${GITHUB_REF_NAME}-site.zip" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
