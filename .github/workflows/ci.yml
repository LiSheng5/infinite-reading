name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# 经 Vite 构建：CI 做五件事——语法检查、构建产物自检、版本号一致性、离线评测、功能单测。
# Node 版本与 package.json 的 engines 对齐（>=24）：可选本地服务用 node:sqlite。
jobs:
  check:
    name: 语法 + 构建 + 版本号
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: JS 语法检查
        run: |
          for f in src/*.js src/app/*.js src/screens/*/*.js src/ui/*.js eval/*.js sidecar/*.mjs tools/*.mjs sw.js; do
            node --check "$f"
          done

      # 拆分结构门禁：脚本顺序 / 行数上限 / A.reg 唯一 / 顶层解构白名单
      - name: 拆分结构门禁（node eval/app-structure-test.js）
        run: node eval/app-structure-test.js

      # 裸调用启发式检查：抓住「搬家后忘了改成 A.xxx(...)」
      - name: 裸调用检查（node tools/check-free-calls.mjs）
        run: node tools/check-free-calls.mjs

      - name: 版本号一致性（VERSION 为真源；运行时版本全部构建注入）
        run: node tools/sync-version.mjs --check

      # 视觉护栏：对比度（WCAG）/ 令牌回归 / 动效强度解析
      - name: 配色与动效护栏（contrast / tokens / motion）
        run: |
          node tools/contrast-check.mjs
          node eval/tokens-test.js
          node eval/motion-test.js

      - name: PWA 清单与图标自检
        run: |
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('manifest.webmanifest','utf8'));if(!m.name||!m.icons||!m.icons.length)throw new Error('manifest 字段不全');m.icons.forEach(i=>{if(!fs.existsSync(i.src))throw new Error('图标缺失: '+i.src)});console.log('manifest ok -> '+m.name+'（'+m.icons.length+' 个图标）')"

      - name: 安装构建依赖
        run: npm ci

      # src/core/*.ts 是 TS（Node 24 原生剥类型执行），静态检查走 tsc --noEmit
      - name: 核心类型检查（tsc --noEmit）
        run: npx tsc --noEmit

      # 构建产物自检（踩过的坑）：sw.js 预缓存清单是构建期生成的，
      # 必须与 dist/site 磁盘真实文件名逐一对上——正则时代「清单与产物脱节」不允许重演。
      - name: 构建 + sw 预缓存清单自检
        run: |
          npm run build
          node -e "
            const fs=require('fs'),path=require('path');
            const out='dist/site';
            const walk=d=>fs.readdirSync(d,{withFileTypes:true}).flatMap(e=>e.isDirectory()?walk(path.join(d,e.name)):[path.relative(out,path.join(d,e.name)).split(path.sep).join('/')]);
            const disk=walk(out).filter(f=>f!=='sw.js').map(f=>'./'+f).sort();
            const sw=fs.readFileSync(path.join(out,'sw.js'),'utf8');
            const m=sw.match(/const PRECACHE = (\[[\s\S]*?\]);/);
            if(!m)throw new Error('sw.js 里没有 PRECACHE 清单');
            const list=JSON.parse(m[1]).slice().sort();
            const miss=list.filter(f=>!disk.includes(f)), extra=disk.filter(f=>!list.includes(f));
            if(miss.length||extra.length)throw new Error('预缓存清单与产物脱节 缺:'+miss+' 多:'+extra);
            const html=fs.readFileSync(path.join(out,'index.html'),'utf8');
            if(html.includes('__IR_VERSION__'))throw new Error('版本占位符未注入');
            if(html.includes('assets/manifest-'))throw new Error('manifest 未回写稳定名');
            console.log('sw 预缓存清单 ok -> '+list.length+' 个文件与产物一致');
          "

      # 单文件产物是发给用户手里的形态，坏了要早知道：跑一遍并检查产物
      - name: 单文件打包冒烟
        run: |
          node tools/bundle-single-file.mjs
          test -s dist/ir.html
          ! grep -qE '<(script|link)[^>]*(src|href)="(css|js|src)/' dist/ir.html
          ! grep -q '__IR_VERSION__' dist/ir.html

  eval:
    name: 离线评测（不花 API）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 安装构建依赖
        run: npm ci

      # 全量离线套件：清单的唯一真源是 package.json 的 test 链（44 个 node eval/* + tsc --noEmit）。
      # 不要在 CI 里手写子集——照抄时漏掉的注释 / CSS 结构 / 空 catch 门禁，
      # 恰恰是这两类改动最该拦住的东西；照抄还会让同一脚本被跑两遍。
      - name: 全量门禁（npm test）
        run: npm test
