name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# 本项目零依赖、零构建，CI 只做四件事：语法检查、版本号一致性、离线评测、功能单测。
# Node 版本与 package.json 的 engines 对齐（>=22）：可选本地服务用 node:sqlite。
jobs:
  check:
    name: 语法 + 版本号
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: JS 语法检查
        run: |
          for f in js/*.js js/app/*.js eval/*.js sidecar/*.mjs tools/*.mjs sw.js; do
            node --check "$f"
          done

      # 拆分结构门禁（任务书 §7）：脚本顺序 / 行数上限 / A.reg 唯一 / 顶层解构白名单
      - name: 拆分结构门禁（node eval/app-structure-test.js）
        run: node eval/app-structure-test.js

      # 裸调用启发式检查：抓住「搬家后忘了改成 A.xxx(...)」
      - name: 裸调用检查（node tools/check-free-calls.mjs）
        run: node tools/check-free-calls.mjs

      - name: 版本号一致性（VERSION 为真源）
        run: node tools/sync-version.mjs --check

      # UI-1 护栏：对比度（WCAG）/ 令牌回归 / 动效强度解析
      - name: 配色与动效护栏（contrast / tokens / motion）
        run: |
          node tools/contrast-check.mjs
          node eval/tokens-test.js
          node eval/motion-test.js

      - name: PWA 清单与图标自检
        run: |
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('manifest.webmanifest','utf8'));if(!m.name||!m.icons||!m.icons.length)throw new Error('manifest 字段不全');m.icons.forEach(i=>{if(!fs.existsSync(i.src))throw new Error('图标缺失: '+i.src)});console.log('manifest ok -> '+m.name+'（'+m.icons.length+' 个图标）')"

      # 单文件打包是「可选工具」，但坏了要早知道：跑一遍并检查产物
      - name: 单文件打包冒烟
        run: |
          node tools/bundle-single-file.mjs
          test -s dist/ir.html
          ! grep -qE '<(script|link)[^>]*(src|href)="(css|js)/' dist/ir.html

  eval:
    name: 离线评测（不花 API）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # eval/run.js 不发任何网络请求；总分低于基线或校验未全中时会返回非 0
      - name: node eval/run.js
        run: node eval/run.js

      # 分支树数据层（js/tree.js + store 集成）：纯逻辑单测，不开浏览器、不联网
      - name: 分支树数据层（node eval/tree-test.js）
        run: node eval/tree-test.js

      # UI-2：自动标题 / 全文搜索 / 书架索引（纯逻辑单测，不联网）
      - name: 书架三件套（node eval/titles-test.js + search-test.js + shelf-index-test.js）
        run: npm run test:shelf

      # 作画串行队列（js/paintQueue.js）：纯逻辑单测，不联网、不依赖真实定时器
      - name: 作画队列单测（node eval/paintqueue-test.js）
        run: node eval/paintqueue-test.js

      # 提案（js/proposals.js：模型发起的邮件 / 下单只能产生提案）：假 sidecar 验安全红线，不联网
      - name: 提案模块单测（node eval/proposals-test.js）
        run: node eval/proposals-test.js

      - name: 演示模式冒烟（node eval/demo-smoke.js）
        run: node eval/demo-smoke.js

      # 带原图的全量备份全靠手写的 ZIP 编码器：CRC / 偏移写错会「能下载但打不开」，这里用独立实现验一遍
      - name: ZIP 读写冒烟（node eval/zip-smoke.js）
        run: node eval/zip-smoke.js

      # 可选本地服务：单测全离线（虚拟时钟 / 内存 SQLite / 假 fetch），sidecar-smoke 会自启子进程走真实 HTTP
      - name: 功能单测（调度 / 邮件 / 支付 / 提案 / 前端客户端 / 侧车冒烟）
        run: npm run test:features
