name: Bug 报告
description: 有东西坏了 / 行为和预期不一样
title: '[Bug] '
body:
  - type: markdown
    attributes:
      value: |
        谢谢你帮忙。为了能快速定位，请尽量把下面的信息填全。

        ⚠️ **不要粘贴 API Key**，也请把截图里的 Key 打码。项目没有后端，Key 只存在你自己的浏览器里。
  - type: input
    id: version
    attributes:
      label: 版本
      description: 见根目录 `VERSION` 文件，或开始页脚「无限阅读 vX.Y.Z」
      placeholder: 0.12.0
    validations:
      required: true
  - type: dropdown
    id: launch
    attributes:
      label: 打开方式
      description: 不同方式的数据不互通，很多"数据不见了"其实是换了打开方式
      options:
        - 双击 index.html（file://）
        - 本地静态服务（localhost）
        - 在线 Demo / 部署在其它域名
        - 其他（在下方说明）
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: 浏览器与系统
      placeholder: Chrome 131 / Windows 11
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: 用的模型与接口类型
      description: 模型名 + 服务商种类（不用写 Base URL 里的密钥）
      placeholder: deepseek-flash（OpenAI 兼容接口）；生图：gpt-image-1
    validations:
      required: false
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开…
        2. 点…
        3. 于是…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 控制台报错、报错截图或 AI 原始回包（如果相关）请贴在这里
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过现有 Issue，没有重复
          required: true
        - label: 我确认贴出的内容里没有 API Key、没有他人隐私数据
          required: true
