<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>无限阅读 · ∞ Reading</title>

<!-- 版本戳：构建期由 vite.config.mjs 的 transformIndexHtml 从根目录 VERSION 注入。
     占位符不许手写成具体版本号——版本号的唯一真源是根目录 VERSION 文件。 -->
<meta name="ir-version" content="__IR_VERSION__">

<!-- 首帧动效档位：css/motion.css 的 :root 默认是 rich，JS 要等 Store.boot() 之后才写
     html[data-motion]——「减少动态效果」的用户会先看到一帧完整动效。
     这里在 <head> 里先按同一套规则（Motion.resolve：显式选择优先，其次系统偏好）写一遍：
     档位真源仍是 settings.ui.motion，落盘时顺带写 ir:motion 镜像（src/core/store.ts），
     启动后 src/app/main.js 的 applyMotion() 会再对一次（含系统偏好变化的跟随）。 -->
<script>
(function () {
  try {
    var pref = '';
    try { pref = localStorage.getItem('ir:motion') || ''; } catch (e) {}
    if (pref !== 'off' && pref !== 'standard' && pref !== 'rich') {
      var mq = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
      pref = (mq && mq.matches) ? 'off' : 'rich';
    }
    document.documentElement.setAttribute('data-motion', pref);
  } catch (e) {}
})();
</script>

<!-- PWA / 图标：manifest + favicon + iOS 主屏图标（图标由 tools/make-icons.mjs 生成，已随仓库提交） -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#FFFFFF">
<meta name="color-scheme" content="light">
<link rel="icon" href="icons/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="无限阅读">

<!-- 字体：不加载任何远程字体（断网也能用，且不依赖第三方 CDN）。
     旁白走衬线系统栈，界面走无衬线系统栈，提示词走等宽——见 css/tokens.css 的字体令牌。 -->

<!-- 样式三层：令牌（css/tokens.css）→ 屏幕样式（css/style.css，只有 @import；
     规则按屏分成 base / home / shelf / read / overlays / responsive / settings / branch / icons）
     → 动效模块（css/motion.css，最后加载：档位政策与暂停规则优先） -->
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/motion.css">
</head>
<body>
<!-- ========== 图标库（手绘 SVG sprite）：24×24 网格 · 1.6 描边 · currentColor。
     用法：<svg class="ic" aria-hidden="true"><use href="#i-名字"/></svg>；JS 里用 IR.App.iconEl('名字')。
     描边 / 圆角样式写在 css/icons.css 的 .ic 上，颜色跟随文字色。 ========== -->
<svg id="ir-icons" width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <!-- 关闭 -->
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></symbol>
    <!-- 设置：齿环 + 八个齿 -->
    <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="6.4"/><path d="M12 3v2.6M12 18.4V21M3 12h2.6M18.4 12H21M5.6 5.6l1.9 1.9M16.5 16.5l1.9 1.9M18.4 5.6l-1.9 1.9M7.5 16.5l-1.9 1.9"/></symbol>
    <!-- 方向 -->
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M19.5 12h-15M10.5 6l-6 6 6 6"/></symbol>
    <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 19.5v-15M6 10.5l6-6 6 6"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 4.5v15M6 13.5l6 6 6-6"/></symbol>
    <symbol id="i-chev" viewBox="0 0 24 24"><path d="M9.5 5.5l6.5 6.5-6.5 6.5"/></symbol>
    <symbol id="i-chev-l" viewBox="0 0 24 24"><path d="M14.5 5.5L8 12l6.5 6.5"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
    <!-- 重来 / 再试一批 -->
    <symbol id="i-redo" viewBox="0 0 24 24"><path d="M4.2 12a7.8 7.8 0 107.8-7.8 7.8 7.8 0 00-5.6 2.4L4.2 8.8"/><path d="M4.2 4.2v4.6h4.6"/></symbol>
    <!-- 加 / 更多 -->
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle fill="currentColor" stroke="none" cx="5.5" cy="12" r="1.5"/><circle fill="currentColor" stroke="none" cx="12" cy="12" r="1.5"/><circle fill="currentColor" stroke="none" cx="18.5" cy="12" r="1.5"/></symbol>
    <!-- 继续上次：回溯的钟 -->
    <symbol id="i-history" viewBox="0 0 24 24"><path d="M4.2 12a7.8 7.8 0 107.8-7.8 7.8 7.8 0 00-5.6 2.4L4.2 8.8"/><path d="M4.2 4.2v4.6h4.6M12 8v4.2l2.8 1.8"/></symbol>
    <!-- 灵感：灯泡 -->
    <symbol id="i-bulb" viewBox="0 0 24 24"><path d="M12 3.2a6 6 0 00-3.6 10.8c.7.6 1.1 1.4 1.1 2.2h5c0-.8.4-1.6 1.1-2.2A6 6 0 0012 3.2z"/><path d="M9.7 19h4.6M10.6 21.2h2.8"/></symbol>
    <!-- 写邮件 -->
    <symbol id="i-mail" viewBox="0 0 24 24"><rect x="3.5" y="5.5" width="17" height="13" rx="2.2"/><path d="M4.4 7.6L12 13.4l7.6-5.8"/></symbol>
    <!-- 定时 -->
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12.5" r="8"/><path d="M12 8v4.6l3 1.8M5 4.2L3.4 5.8M19 4.2l1.6 1.6"/></symbol>
    <!-- 代下单 -->
    <symbol id="i-cart" viewBox="0 0 24 24"><path d="M3 4.5h2.6l1.9 10.2h10.2l1.8-7.4H6.4"/><circle cx="9.6" cy="19" r="1.4"/><circle cx="16.8" cy="19" r="1.4"/></symbol>
    <!-- 作画：调色盘 -->
    <symbol id="i-palette" viewBox="0 0 24 24"><path d="M12 3.6a8.4 8.4 0 100 16.8c1.3 0 1.9-.8 1.9-1.7 0-.5-.2-.9-.5-1.3-.3-.4-.5-.8-.5-1.3 0-1 .8-1.7 1.8-1.7h2.1a3.7 3.7 0 003.7-3.7C20.5 7.1 16.7 3.6 12 3.6z"/><circle fill="currentColor" stroke="none" cx="7.6" cy="11.2" r="1.1"/><circle fill="currentColor" stroke="none" cx="10.4" cy="7.4" r="1.1"/><circle fill="currentColor" stroke="none" cx="15.2" cy="7.8" r="1.1"/></symbol>
    <!-- 画师工作台：铅笔 -->
    <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M4.2 19.8l.9-4L16.6 4.3a2 2 0 012.8 0l.3.3a2 2 0 010 2.8L8.2 18.9z"/><path d="M14.4 6.5l3.1 3.1"/></symbol>
    <!-- 沉浸：四角 -->
    <symbol id="i-expand" viewBox="0 0 24 24"><path d="M4 9.2V4h5.2M14.8 4H20v5.2M20 14.8V20h-5.2M9.2 20H4v-5.2"/></symbol>
    <!-- 视频：胶片 -->
    <symbol id="i-film" viewBox="0 0 24 24"><rect x="3.5" y="4.8" width="17" height="14.4" rx="2"/><path d="M8 4.8v14.4M16 4.8v14.4M3.5 9.6H8M3.5 14.4H8M16 9.6h4.5M16 14.4h4.5"/></symbol>
    <!-- 播放 -->
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.6v12.8a.8.8 0 001.2.7l10-6.4a.8.8 0 000-1.4L9.2 4.9A.8.8 0 008 5.6z"/></symbol>
    <!-- 测试连接：闪电 -->
    <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13.4 3L5.6 13.4h5.4l-.9 7.6 8.3-10.9h-5.4z"/></symbol>
    <!-- 提示 / 完成 -->
    <symbol id="i-warn" viewBox="0 0 24 24"><path d="M12 4.2L3 19.4h18z"/><path d="M12 10v4.4M12 17.2h.01"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.6l4.6 4.5L19 7.6"/></symbol>
    <!-- 三种模式：剧情 = 书；智能体 = 对话框；扮演 = 面具 -->
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M3.8 5.6c2.7-1 5.6-.8 8.2.8 2.6-1.6 5.5-1.8 8.2-.8v12.8c-2.7-1-5.6-.8-8.2.8-2.6-1.6-5.5-1.8-8.2-.8z"/><path d="M12 6.4v12.8"/></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M5.2 4.8h13.6a1.7 1.7 0 011.7 1.7v8.2a1.7 1.7 0 01-1.7 1.7h-6.4l-4.6 3.5v-3.5H5.2a1.7 1.7 0 01-1.7-1.7V6.5a1.7 1.7 0 011.7-1.7z"/><path d="M8 10h8M8 13h4.6"/></symbol>
    <symbol id="i-mask" viewBox="0 0 24 24"><path d="M4.6 5.4c4.6-1.4 10.2-1.4 14.8 0v6.2c0 4.3-3.2 7.6-7.4 7.6s-7.4-3.3-7.4-7.6z"/><path d="M8 10.4c.9-.7 2-.7 2.9 0M13.1 10.4c.9-.7 2-.7 2.9 0M9.2 14.6c1.6 1.5 4 1.5 5.6 0"/></symbol>
    <!-- AI 主动：四角星 -->
    <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3.2l2.3 6.5 6.5 2.3-6.5 2.3L12 20.8l-2.3-6.5L3.2 12l6.5-2.3z"/></symbol>
  </defs>
</svg>

<div id="app">

  <!-- ========== 开始页（应用入口） ==========
       顶部是 ASCII 无限符号（src/screens/home 把每个字符包成 span，做深蓝 → 浅蓝的循环；
       没有 JS 时就是下面这块静态深蓝字符画，「静态深蓝版本」兜底）；
       三张模式卡即三个开局入口；其余入口收成底部一排文字链接。 -->
  <section id="screen-start" class="screen">
    <!-- 正式内容由 src/screens/home 挂载（挂载时 replaceChildren 清掉兜底）；
         以下是无 JS 兜底：静态深蓝字符画（「没有 JS 或动画关闭时也要有静态深蓝版本」）。 -->
    <div class="start-card">
      <h1 class="start-mark" aria-label="无限阅读"><pre class="inf" aria-hidden="true">    .-~~~~-.       .-~~~~-.
  .'        '.   .'        '.
 /            \ /            \
|              X              |
 \            / \            /
  '.        .'   '.        .'
    '-~~~~-'       '-~~~~-'</pre></h1>
    </div>
  </section>

  <!-- ========== 书架：会话列表 + 搜索 + 新建弹层 ========== -->
  <section id="screen-shelf" class="screen hidden">
    <!-- 内容由 src/screens/shelf 挂载：阶段 6 已删除 0.12.1 的旧 DOM -->
  </section>

  <!-- ========== 阅读界面：左文右图，各管各的
       布局只由 #screen-game 的 data-layout 决定：split | stack | immersive。
       输入区只有一个（沉浸态也不另起一套输入）。 ========== -->
  <section id="screen-game" class="screen hidden" data-layout="split">
    <header class="hud">
      <div class="hud-left">
        <button id="btn-back-home" class="ui-btn hud hud-icon" title="返回首页（自动存档）" aria-label="返回首页"><svg class="ic" aria-hidden="true"><use href="#i-back"/></svg></button>
        <button id="btn-hud-shelf" class="ui-btn hud hud-text" title="我的书架">书架</button>
        <span id="hud-mode" class="mode-chip"></span>
      </div>
      <div class="hud-actions">
        <button id="btn-toggle-image" class="ui-btn hud" title="收起 / 展开画面">画面</button>
        <div class="hud-more">
          <button id="btn-hud-more" class="ui-btn hud hud-icon" title="更多" aria-label="更多" aria-haspopup="menu" aria-expanded="false"><svg class="ic" aria-hidden="true"><use href="#i-more"/></svg></button>
          <div id="hud-more-menu" class="menu hidden" role="menu">
            <button id="btn-savepoint" class="menu-item" type="button" role="menuitem">打一个存档点</button>
            <button id="btn-branch" class="menu-item" type="button" role="menuitem">分支</button>
            <button id="btn-hud-new" class="menu-item" type="button" role="menuitem">开一个新故事</button>
            <button id="btn-manual-gen" class="menu-item" type="button" role="menuitem">为当前场景作画</button>
            <button id="btn-manual-video" class="menu-item" type="button" role="menuitem">为当前场景生成视频</button>
            <button id="btn-story-prefs" class="menu-item" type="button" role="menuitem">本对话设置</button>
            <button id="btn-settings" class="menu-item" type="button" role="menuitem">全局设置</button>
          </div>
        </div>
      </div>
      <!-- 顶栏忙碌进度线：busy 时由 app.js 显隐；样式见 css/base.css，三档动效见 css/motion.css -->
      <div id="busy-line" class="hidden" aria-hidden="true"></div>
    </header>

    <div id="game-layout" class="game-layout">
    <!-- 内容由 src/screens/read 挂载：阶段 6 已删除 0.12.1 的旧 DOM -->
  </div>
  </section>

  <!-- ========== 分支页：整页分支树 + 从任意节点继续 / 改我说的分叉 ========== -->
  <div id="branch-page" class="branch-page hidden" role="dialog" aria-modal="true" aria-label="分支视图">
    <!-- 内容由 src/screens/branch 挂载：阶段 6 已删除 0.12.1 的旧 DOM -->
  </div>

  <!-- ========== 新故事 · 选模式 ========== -->
  <div id="modal-new" class="modal hidden">
    <!-- 内容由 src/screens/modal 挂载：阶段 6 已删除 0.12.1 的旧 DOM -->
  </div>

  <!-- ========== 开局设定向导（剧情模式） ========== -->
  <div id="modal-wizard" class="modal hidden">
    <!-- 内容由 src/screens/modal 挂载：阶段 6 已删除 0.12.1 的旧 DOM -->
  </div>

  <!-- ========== 剧情文本导入（路径②） ========== -->
  <div id="modal-import-text" class="modal hidden">
    <!-- 内容由 src/screens/modal 挂载：阶段 6 已删除 0.12.1 的旧 DOM -->
  </div>

  <!-- ========== 导出 ========== -->
  <div id="modal-export" class="modal hidden">
    <!-- 内容由 src/screens/modal 挂载：阶段 6 已删除 0.12.1 的旧 DOM -->
  </div>

  <!-- ========== 画师工作台 ========== -->
  <div id="modal-painter" class="modal hidden">
    <!-- 内容由 src/screens/modal 挂载：阶段 6 已删除 0.12.1 的旧 DOM -->
  </div>

  <!-- ========== 画风锚定 ========== -->
  <div id="modal-anchor" class="modal hidden">
    <!-- 内容由 src/screens/modal 挂载：阶段 6 已删除 0.12.1 的旧 DOM -->
  </div>

  <!-- ========== 角色卡：统一编辑器 = 自建空白表单 / 导入后可编辑 ========== -->
  <div id="modal-card" class="modal modal-top hidden">
    <!-- 内容由 src/screens/modal 挂载：阶段 6 已删除 0.12.1 的旧 DOM -->
  </div>

    <!-- ========== 设置（模型 / 辅助模型 / 画面 / 工具与服务 / 数据 / 外观 / 当前故事） ==========
       版式原则：每个分组只露「必填 + 常改」的字段；高级参数、长说明、单独配置一律折进 <details>
       （js/app/prefsui.js 的 syncAdvPanels 会在已有内容时自动展开）。fieldset → 分组由 legend 文字归类。 -->
  <div id="modal-settings" class="modal hidden">
    <!-- 内容由 src/screens/settings 挂载：阶段 6 已删除 0.12.1 的旧 DOM -->
  </div>

<!-- ========== 本对话设置：桌面右侧停靠 / 窄屏底部弹层；内容按模式渲染 ==========
     阶段 4 屏 2 起：「当前故事」组（推进模式 / 存档点 / 世界状态卡）自全局设置迁入本面板——
     它们依赖当前打开的故事，全局设置不再保留入口。 -->
  <aside id="story-prefs" class="story-prefs hidden" aria-label="本对话设置">
    <!-- 内容由 src/screens/storyPrefs 挂载：阶段 6 已删除 0.12.1 的旧 DOM -->
  </aside>

  <!-- ========== 通用确认 / 输入弹窗 ==========
       替代原生 confirm / prompt：内嵌预览（沙箱 iframe）会静默忽略原生弹窗、
       直接返回 false / null，表现为「点了没反应」，因此一律走这个自建弹窗。 -->
  <div id="modal-confirm" class="modal modal-top hidden">
    <!-- 内容由 src/screens/modal 挂载：阶段 6 已删除 0.12.1 的旧 DOM -->
  </div>

  <input id="file-import" type="file" accept=".json,.irstory.json,.irbackup.json,.zip,application/json,application/zip" class="hidden">
  <input id="file-card" type="file" accept=".png,image/png" class="hidden">
  <!-- 提示条：固定在顶栏下方居中；pointer-events: none（错误提示的关闭按钮单独放行），
       不遮挡输入框 / 发送键 / 弹窗底部按钮。同一时刻只保留一条，后来者替换前者。 -->
  <div id="toast" class="toast hidden" role="status" aria-live="polite">
    <span id="toast-text"></span>
    <button id="toast-close" class="toast-close hidden" type="button" title="关闭提示" aria-label="关闭"><svg class="ic" aria-hidden="true"><use href="#i-x"/></svg></button>
  </div>
</div>

  <!-- ========== 写邮件（可选本地服务） ========== -->
  <div id="modal-email" class="modal hidden">
    <!-- 内容由 src/screens/modal 挂载：阶段 6 已删除 0.12.1 的旧 DOM -->
  </div>

  <!-- ========== 代为下单（可选本地服务；策略由网关强制） ========== -->
  <div id="modal-payment" class="modal hidden">
    <!-- 内容由 src/screens/modal 挂载：阶段 6 已删除 0.12.1 的旧 DOM -->
  </div>

<!-- 图片灯箱（chat / rp 内联图点开看大图）：固定遮罩，点遮罩 / Esc 关闭 -->
<div id="lightbox" class="lightbox hidden" role="dialog" aria-label="查看大图">
  <img id="lightbox-img" alt="">
  <p id="lightbox-alt" class="lightbox-alt"></p>
</div>

<!-- 唯一入口：加载顺序与依赖见 src/main.js（阶段 6 删掉 legacy 入口与全局 IR 兼容层） -->
<script type="module" src="src/main.js"></script>
</body>
